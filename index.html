<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HexaGrim Portfolio</title>
    <style>
        body {
            margin: 0;
            background: #000000; color: #fff;
            font-family: sans-serif; 
            overflow-x: hidden;
        }
        #canvas-container { 
            position: fixed; 
            top: 0; 
            left: 0;
            width: 100%; 
            height: 100%; 
            z-index: 1;
        }
        .content { 
            position: relative;
            z-index: 2; 
        }
        .hero {
             height: 70vh; 
        }
        .info { 
            padding: 50px; 
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.294);
            text-align: center; max-width: 600px;
            margin: auto; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.183);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.855);
        }
        h1{
            font-family:'Trebuchet MS';
            -webkit-backdrop-filter: blur(200px);
            background-color:   #ffffff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.686);
            -webkit-background-clip:text;
            color: transparent;
            background-clip:text;
            font-weight: 100;
            font-style:italic;
        }
        a{
            text-shadow: 0 0 5px rgba(255, 251, 0, 0.686);
            color: gold;
        }
        p{
        font-family:'Trebuchet MS';
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="canvas-container"></div>

    <div class="content">

        <section class="hero"></section>

        <section class="info">
            <h1>The guy who makes games!</h1>
            <p>I make silly games and upload them on my <strong><a href="https://hexagrim.itch.io">Itch Page</a></strong></p>
            <p>hexagrim3456@gmail.com</p>
        </section>
    </div>
    <script src="main.js"></script>

</body>


</html>
